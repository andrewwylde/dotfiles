[package]
name = "agent-sync"
version = "0.1.0"
edition = "2021"
description = "Fan out agent-neutral Library skills/commands/agents/hooks to coding agent Targets"
license = "MIT"
publish = false

[[bin]]
name = "agent-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
fs_extra = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
