# agent-sync release binaries
name: agent-sync-release

on:
  push:
    tags:
      - "agent-sync-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: agent-sync-darwin-arm64
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            asset: agent-sync-linux-amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            asset: agent-sync-linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            asset: agent-sync-windows-amd64
            target: x86_64-pc-windows-msvc
            exe: true

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-sync

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --locked
      - name: Package (unix)
        if: ${{ !matrix.exe }}
        run: |
          BIN=target/release/agent-sync
          tar -czf "../${{ matrix.asset }}.tar.gz" -C target/release agent-sync
          shasum -a 256 "../${{ matrix.asset }}.tar.gz" | awk '{print $1}' > "../${{ matrix.asset }}.tar.gz.sha256"
      - name: Package (windows)
        if: ${{ matrix.exe }}
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/agent-sync.exe -DestinationPath "../${{ matrix.asset }}.zip"
          Get-FileHash "../${{ matrix.asset }}.zip" -Algorithm SHA256 |
            ForEach-Object { $_.Hash.ToLower() } |
            Set-Content "../${{ matrix.asset }}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
